<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>BASE. | Premium Minimal Fashion</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>try{if(localStorage.getItem("base-theme")==="light")document.documentElement.dataset.theme="light"}catch(e){}</script>
</head>
<body>
    <header class="glass-header">
        <div class="header-inner">
            <a href="#" class="brand-logo">BASE.</a>
            <nav class="nav-links">
                <a href="#catalog">Каталог</a>
                <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Переключить тему" title="Переключить тему">
                    <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"></path></svg>
                    <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 15.5A8.5 8.5 0 0 1 8.5 3.5a8.7 8.7 0 1 0 12 12Z"></path></svg>
                </button>
            </nav>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="hero-content">
                <h1 class="hero-title">BASE.</h1>
                <p class="hero-subtitle">Форма, в которой удобно быть собой.<br>Каждый день.</p>
                <a href="#catalog" class="btn-glass">Открыть коллекцию</a>
            </div>
            <div class="hero-image">
                <img src="images_cards/card_hoodie-lsd.jpg" alt="BASE. коллекция одежды">
            </div>
        </section>

        <section id="catalog" class="catalog-section">
            <div class="container">
                <div class="catalog-heading">
                    <div>
                        <span class="catalog-eyebrow">BASE / COLLECTION</span>
                        <h2>Каталог</h2>
                    </div>
                    <p>Вещи, которые легко собрать в свой гардероб.</p>
                </div>
                <div class="product-grid" id="products-grid">
                    <!-- Products rendered via JS -->
                </div>
            </div>
        </section>
    </main>

    <footer class="minimal-footer">
        <div class="container footer-content">
            <div class="footer-brand">BASE.</div>
            <p class="footer-note">База без лишнего. Вещи, к которым хочется возвращаться.</p>
            <div class="footer-links">
                <a href="#catalog">Каталог</a>
                <a href="https://t.me/nthngv" target="_blank" rel="noopener noreferrer">Telegram</a>
                <a href="#">Доставка</a>
                <a href="#">Возврат</a>
            </div>
        </div>
    </footer>

    <div id="product-sheet-overlay" class="sheet-overlay">
        <div id="product-sheet" class="bottom-sheet" role="dialog" aria-modal="true" aria-label="Информация о товаре">
            <button class="sheet-close" id="sheet-close" aria-label="Закрыть">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
            
            <div class="sheet-content">
                <div class="sheet-image-container">
                    <img id="sheet-img" src="" alt="Товар">
                </div>
                
                <div class="sheet-info-container">
                    <div class="sheet-header">
                        <h2 id="sheet-title" class="sheet-title"></h2>
                        <p id="sheet-subtitle" class="sheet-subtitle"></p>
                        <p id="sheet-price" class="sheet-price"></p>
                    </div>

                    <div class="sheet-options">
                        <div class="option-section" id="color-section">
                            <label class="option-label">Цвет</label>
                            <div class="chips-group" id="sheet-colors"></div>
                        </div>

                        <div class="option-section" id="size-section">
                            <label class="option-label">Размер</label>
                            <div class="chips-group" id="sheet-sizes"></div>
                        </div>
                    </div>

                    <div class="sheet-details">
                        <div class="detail-row" id="detail-material">
                            <span class="detail-label">Материал</span>
                            <span class="detail-value" id="val-material"></span>
                        </div>
                        <div class="detail-row" id="detail-fit">
                            <span class="detail-label">Посадка</span>
                            <span class="detail-value" id="val-fit"></span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="sheet-cta-container">
                <button id="btn-order" class="btn-primary disabled">
                    <span class="btn-text">Выберите размер</span>
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
